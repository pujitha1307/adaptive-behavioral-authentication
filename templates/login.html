<!DOCTYPE html>
<html>
<head>
    <title>Secure Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
            justify-content: center;
            align-items: center;
            background: #f4f6f8;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin-top: 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Secure Access</h2>
        <p>Click below to start a secure behavioral authentication session.</p>
        <form action="/start-session" method="POST">
            <button type="submit">Start Secure Session</button>
        </form>
    </div>
</body>
</html>
